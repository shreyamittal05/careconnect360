<header class="cc-navbar sticky-top">
  <nav class="navbar navbar-expand-lg container py-2" aria-label="Main navigation">
    <a class="navbar-brand cc-brand" href="{{ url_for('main.index') }}">
      <img src="{{ url_for('static', filename='images/logo.svg') }}" alt="CareConnect360 logo">
    </a>
    <button class="navbar-toggler border-0" type="button" data-bs-toggle="collapse" data-bs-target="#mainNav" aria-controls="mainNav" aria-expanded="false" aria-label="Toggle navigation">
      <i class="fa-solid fa-bars fs-4"></i>
    </button>
    <div class="collapse navbar-collapse" id="mainNav">
      <ul class="navbar-nav mx-auto gap-lg-1 mt-3 mt-lg-0">
        {% if request.endpoint == 'main.index' %}
          <li class="nav-item"><a class="nav-link active" href="#home">Home</a></li>
          <li class="nav-item"><a class="nav-link" href="#about">About</a></li>
          <li class="nav-item"><a class="nav-link" href="#services">Services</a></li>
          <li class="nav-item"><a class="nav-link" href="#doctors">Doctors</a></li>
          <li class="nav-item"><a class="nav-link" href="#contact">Contact</a></li>
        {% else %}
          <li class="nav-item"><a class="nav-link" href="{{ url_for('main.index') }}#home">Home</a></li>
          <li class="nav-item"><a class="nav-link" href="{{ url_for('main.index') }}#about">About</a></li>
          <li class="nav-item"><a class="nav-link" href="{{ url_for('main.index') }}#services">Services</a></li>
          <li class="nav-item"><a class="nav-link" href="{{ url_for('main.index') }}#doctors">Doctors</a></li>
          <li class="nav-item"><a class="nav-link" href="{{ url_for('main.index') }}#contact">Contact</a></li>
        {% endif %}
      </ul>
      <div class="d-flex flex-column flex-lg-row gap-2 mt-3 mt-lg-0 pb-3 pb-lg-0">
        {% if current_user %}
          <a class="btn btn-primary" href="{{ url_for('main.doctor_dashboard' if current_user.is_doctor else 'main.dashboard') }}">
            <i class="fa-solid fa-gauge-high me-1"></i> Go to dashboard
          </a>
        {% else %}
          <a class="btn btn-outline-primary" href="{{ url_for('main.login') }}">Log in</a>
          <a class="btn btn-primary" href="{{ url_for('main.register') }}">Get started</a>
        {% endif %}
      </div>
    </div>
  </nav>
</header>
